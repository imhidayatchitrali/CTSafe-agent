components:
  schemas:
    CompanyInput:
      properties:
        company_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Company Name
        vat_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Vat Number
        ateco_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Ateco Code
        activity_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Activity Description
        employee_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Employee Count
        mansions:
          items:
            type: string
          type: array
          title: Mansions
        site_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Site Address
        document_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Type
        risk_category:
          anyOf:
          - type: string
          - type: 'null'
          title: Risk Category
        sector_hazards:
          items:
            type: string
          type: array
          title: Sector Hazards
        risks_by_mansion:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          title: Risks By Mansion
        normative_references:
          items:
            type: string
          type: array
          title: Normative References
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      type: object
      title: CompanyInput
    CreateProjectRequest:
      properties:
        company:
          $ref: '#/components/schemas/CompanyInput'
        source_channel:
          type: string
          title: Source Channel
          default: api
      type: object
      required:
      - company
      title: CreateProjectRequest
    DocumentPatchRequest:
      properties:
        instruction:
          type: string
          title: Instruction
        target_section_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Target Section Id
      type: object
      required:
      - instruction
      title: DocumentPatchRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IndexReviewRequest:
      properties:
        decision:
          $ref: '#/components/schemas/IndexStatus'
        reviewer_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewer Notes
      type: object
      required:
      - decision
      title: IndexReviewRequest
    IndexStatus:
      type: string
      enum:
      - draft
      - approved
      - rejected
      - needs_revision
      title: IndexStatus
    IntakeRequest:
      properties:
        company:
          $ref: '#/components/schemas/CompanyInput'
        source_channel:
          type: string
          title: Source Channel
          default: api
      type: object
      required:
      - company
      title: IntakeRequest
    RagSearchInput:
      properties:
        query:
          type: string
          title: Query
        corpus:
          type: string
          title: Corpus
          default: normativa
        filters:
          type: object
          title: Filters
        top_k:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Top K
          default: 4
      type: object
      required:
      - query
      title: RagSearchInput
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
